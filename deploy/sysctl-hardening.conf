# Kernel hardening for the go-poker docker host.
# Install: sudo cp deploy/sysctl-hardening.conf /etc/sysctl.d/90-go-poker.conf && sudo sysctl --system
# See deploy/HARDENING.md for what each group does.

# --- SYN flood -------------------------------------------------------------
# Answer SYNs with cookies instead of allocating a half-open connection when
# the backlog fills; the single most important knob against SYN floods.
net.ipv4.tcp_syncookies = 1
# Larger half-open backlog before cookies kick in.
net.ipv4.tcp_max_syn_backlog = 8192
# Give up on half-open connections quickly (default 5 retries ≈ 3 min).
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3
# Accept queue depth for listen(); the Go server uses the kernel default.
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384

# --- Connection hoarding / stale sockets ------------------------------------
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15
# Cap the memory an attacker can pin with abandoned connections.
net.ipv4.tcp_max_orphans = 65536
net.ipv4.tcp_max_tw_buckets = 262144
net.ipv4.tcp_tw_reuse = 1

# --- Spoofing / redirects ---------------------------------------------------
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_rfc1337 = 1

# --- Conntrack (docker NAT) -------------------------------------------------
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30

# --- File descriptors for many WebSockets -----------------------------------
fs.file-max = 1048576
