name: go-poker-hot

services:
  go-poker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: go-poker-hot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./backend:/app
      - ./.env:/app/.env
      - gomodcache:/root/go/pkg/mod
    depends_on:
      - redis

  web:
    image: node:18-alpine
    container_name: go-poker-web-hot
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      # WS 地址默认由浏览器根据当前 hostname 自动推导（同一主机的 8080 端口）。
      # 特殊场景可覆盖，例如：NEXT_PUBLIC_WS_URL: wss://your.domain/ws
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - go-poker

  redis:
    image: redis:latest
    container_name: go-poker-redis-hot
    restart: unless-stopped
    entrypoint: redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-hot:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gomodcache:
  web_node_modules:
  redis-hot:
