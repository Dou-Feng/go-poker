name: go-poker-hot

services:
  go-poker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: go-poker-hot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./backend:/app
      - ./.env:/app/.env
      - gomodcache:/root/go/pkg/mod
    depends_on:
      - redis

  web:
    image: node:18-alpine
    container_name: go-poker-web-hot
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 8080"
    environment:
      # 后端现在监听 3000，必须显式指定 WS 地址，否则会自动推导到同 host 的 8080
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://124.222.88.3:3000/ws}
      WATCHPACK_POLLING: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - go-poker

  redis:
    image: redis:latest
    container_name: go-poker-redis-hot
    restart: unless-stopped
    entrypoint: redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-hot:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gomodcache:
  web_node_modules:
  redis-hot: