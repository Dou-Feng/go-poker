services:
  go-poker:
    image: evanofslack/go-poker:latest
    container_name: go-poker
    restart: unless-stopped
    ports:
      # Plain HTTP. Without TLS this is the app; with TLS it only answers
      # ACME challenges and redirects to https. Map it to 80 for Let's
      # Encrypt (HTTP_PORT=80 in .env).
      - "${HTTP_PORT:-8080}:8080"
      # HTTPS listener (only bound when TLS_DOMAINS or TLS_CERT_FILE is set).
      - "${HTTPS_PORT:-443}:443"
    environment:
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./.env:/app/.env   # 挂载 .env 文件到容器内 (TLS_* / rate-limit knobs are read from here too)
      - ./certs:/app/certs   # Let's Encrypt cache, or drop your own cert/key here
    # Many concurrent WebSockets need many file descriptors.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - redis

  redis:
    container_name: go-poker-redis
    image: redis:latest
    restart: unless-stopped
    # The redis image does not expand env vars itself, so requirepass must go
    # through a shell. "$$" escapes compose interpolation; the shell inside
    # the container expands $REDIS_PASSWORD. REDIS_URL must then carry the
    # credentials: redis://default:$REDIS_PASSWORD@redis:6379
    entrypoint: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  redis:
  certs:
